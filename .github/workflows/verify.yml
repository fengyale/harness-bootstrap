name: package-gate

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  verify:
    # Windows-first: the scripts and tests are validated on Windows PowerShell 5.1.
    # Add a pwsh/ubuntu job once path separators and chmod behaviour are verified.
    runs-on: windows-latest
    # The behaviour suite spawns a PowerShell process per git hook; a hung step
    # would otherwise burn the default budget (6 h).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Package self check
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\verify-package.ps1

      - name: Behaviour tests
        # Mirror the suite output into the run summary. The raw job log needs a
        # signed-in session to download, so a red run used to leave no evidence
        # on the public run page; the summary is readable without auth.
        shell: powershell
        run: |
          $log = (powershell -NoProfile -ExecutionPolicy Bypass -File tests\run-all.ps1 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Host $log
          if ($code -ne 0) {
            $fence = '```'
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## Behaviour tests failed (exit $code)" -Encoding UTF8
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $fence -Encoding UTF8
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $log -Encoding UTF8
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $fence -Encoding UTF8
            exit 1
          }

      - name: Audit summary order
        # The package itself has no .harness/changes, so this step skips here;
        # it documents the CI wiring installed projects should copy.
        if: github.event_name == 'pull_request'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File templates\scripts\audit-order.ps1 -Root . -Base "${{ github.event.pull_request.base.sha }}"
